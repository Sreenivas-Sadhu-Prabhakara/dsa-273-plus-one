<text x="56.0" y="181.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">[1,2,9]: 9 becomes 0 and carries; the 2 absorbs it → [1,3,0]. The loop walks</text>
