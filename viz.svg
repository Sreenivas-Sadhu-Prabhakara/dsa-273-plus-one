<text x="56.0" y="299.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">All nines ([9,9]) overflow every position — prepend a 1: [1,0,0]. That one growth</text>
